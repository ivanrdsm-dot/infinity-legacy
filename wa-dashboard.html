<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Infinity Legacy — Bot Dashboard</title>
  <meta name="robots" content="noindex, nofollow" />
  <style>
    :root{
      --gold:#C7A76C; --gold-dark:#A8843D; --gold-light:#DFC99A;
      --dark:#0B0F14; --dark-mid:#1A2030; --dark-soft:#1F2638;
      --gray:#3A3F46; --gray-light:#6B7280;
      --cream:#F6F1E6; --border:#E7DDCB;
      --green:#25D366; --red:#E54848; --orange:#F59E0B;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,'Inter',sans-serif;background:var(--dark);color:var(--cream);min-height:100vh;overflow-x:hidden}
    a{color:inherit;text-decoration:none}
    button{cursor:pointer;font-family:inherit}

    /* TOP BAR */
    .topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 24px;background:var(--dark-soft);border-bottom:1px solid rgba(199,167,108,.16)}
    .topbar .brand{font-family:Georgia,serif;font-size:1.15rem;color:var(--gold);font-weight:600}
    .topbar .stats{display:flex;gap:24px;font-size:.78rem}
    .topbar .stat{display:flex;flex-direction:column}
    .topbar .stat .lbl{color:var(--gray-light);font-size:.7rem;letter-spacing:.1em;text-transform:uppercase}
    .topbar .stat .val{font-size:1.05rem;color:var(--gold);font-weight:600}
    .topbar .live{display:flex;align-items:center;gap:6px;font-size:.74rem;color:rgba(255,255,255,.6)}
    .topbar .live .dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);animation:pulse 1.5s ease-in-out infinite}
    .topbar .live .ts{color:rgba(255,255,255,.45);font-size:.7rem;margin-left:6px}
    .topbar .sound-toggle{cursor:pointer;font-size:.9rem;margin-left:8px;opacity:.7;transition:opacity .15s}
    .topbar .sound-toggle:hover{opacity:1}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
    @keyframes flash{0%{background:rgba(37,211,102,.4)}100%{background:transparent}}
    .lead-item.new{animation:flash 2.4s ease-out 1}
    .stat .val.changed{animation:flash 1.8s ease-out 1;border-radius:6px}

    /* LAYOUT */
    .app{display:grid;grid-template-columns:340px 1fr;height:calc(100vh - 56px)}

    /* LIST PANEL */
    .list-panel{background:var(--dark-mid);border-right:1px solid rgba(199,167,108,.1);overflow-y:auto}
    .list-search{padding:14px;border-bottom:1px solid rgba(199,167,108,.08)}
    .list-search input{width:100%;padding:8px 12px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:8px;color:var(--cream);font-size:.86rem;font-family:inherit}
    .lead-item{padding:14px 18px;border-bottom:1px solid rgba(255,255,255,.04);cursor:pointer;transition:background .15s}
    .lead-item:hover{background:rgba(199,167,108,.06)}
    .lead-item.active{background:rgba(199,167,108,.12);border-left:3px solid var(--gold);padding-left:15px}
    .lead-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px}
    .lead-name{font-weight:600;font-size:.92rem}
    .lead-time{font-size:.7rem;color:var(--gray-light)}
    .lead-preview{font-size:.78rem;color:rgba(255,255,255,.62);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:6px}
    .lead-meta{display:flex;gap:6px;flex-wrap:wrap}
    .badge{display:inline-block;padding:2px 8px;border-radius:50px;font-size:.66rem;font-weight:600;letter-spacing:.04em}
    .badge.stage{background:rgba(199,167,108,.16);color:var(--gold)}
    .badge.plan{background:rgba(255,255,255,.06);color:rgba(255,255,255,.74)}
    .badge.urgent{background:rgba(229,72,72,.16);color:var(--red)}
    .badge.paused{background:rgba(245,158,11,.16);color:var(--orange)}

    /* CONVERSATION PANEL */
    .convo-panel{display:flex;flex-direction:column;overflow:hidden}
    .convo-head{padding:14px 22px;background:var(--dark-soft);border-bottom:1px solid rgba(199,167,108,.1);display:flex;align-items:center;justify-content:space-between}
    .convo-head .info{display:flex;flex-direction:column;gap:4px}
    .convo-head .info .nm{font-size:1.05rem;font-weight:600}
    .convo-head .info .ph{font-size:.78rem;color:var(--gray-light)}
    .convo-head .actions{display:flex;gap:8px}
    .convo-head .actions button{padding:7px 14px;border:1px solid rgba(199,167,108,.2);background:transparent;color:var(--cream);font-size:.78rem;border-radius:8px;font-weight:500;transition:all .15s}
    .convo-head .actions button:hover{background:rgba(199,167,108,.1)}
    .convo-head .actions button.danger{border-color:rgba(229,72,72,.3);color:var(--red)}
    .convo-head .actions button.primary{background:var(--gold);color:var(--dark);border-color:var(--gold);font-weight:600}

    .convo-body{flex:1;overflow-y:auto;padding:24px;background:linear-gradient(180deg,var(--dark) 0%,var(--dark-mid) 100%)}
    .msg{margin-bottom:14px;display:flex;flex-direction:column;max-width:75%}
    .msg.in{align-items:flex-start;align-self:flex-start;margin-right:auto}
    .msg.out{align-items:flex-end;align-self:flex-end;margin-left:auto}
    .msg .bubble{padding:10px 14px;border-radius:14px;font-size:.92rem;line-height:1.55;white-space:pre-wrap;word-break:break-word}
    .msg.in .bubble{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);color:var(--cream);border-bottom-left-radius:4px}
    .msg.out .bubble{background:linear-gradient(135deg,var(--gold) 0%,var(--gold-dark) 100%);color:var(--dark);border-bottom-right-radius:4px}
    .msg.out.from-ivan .bubble{background:linear-gradient(135deg,var(--green) 0%,#1ebe5a 100%);color:#fff}
    .msg .meta{font-size:.66rem;color:var(--gray-light);margin-top:4px;letter-spacing:.04em}
    .msg.out .meta{text-align:right}

    .convo-input{padding:16px 22px;background:var(--dark-soft);border-top:1px solid rgba(199,167,108,.1);display:flex;gap:10px;align-items:center}
    .convo-input textarea{flex:1;padding:11px 14px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);border-radius:10px;color:var(--cream);font-family:inherit;font-size:.92rem;resize:none;min-height:42px;max-height:120px}
    .convo-input button{padding:11px 22px;background:var(--gold);color:var(--dark);border:0;border-radius:10px;font-weight:600;font-size:.86rem;transition:all .15s}
    .convo-input button:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(199,167,108,.32)}
    .convo-input button:disabled{opacity:.5;cursor:not-allowed}

    .empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--gray-light);text-align:center;padding:48px;gap:12px}
    .empty-state .icon{font-size:3rem;opacity:.4}
    .empty-state .msg{font-size:1rem;color:rgba(255,255,255,.5)}
    .empty-state .hint{font-size:.84rem;color:var(--gray-light);max-width:380px;line-height:1.6}

    .loading{display:flex;justify-content:center;padding:40px;color:var(--gray-light);font-size:.86rem}

    /* Toast */
    .toast{position:fixed;bottom:24px;right:24px;padding:12px 18px;background:var(--dark-soft);border-left:3px solid var(--gold);border-radius:8px;color:var(--cream);font-size:.86rem;box-shadow:0 8px 32px rgba(0,0,0,.4);transform:translateX(120%);transition:transform .3s ease}
    .toast.show{transform:translateX(0)}
    .toast.error{border-left-color:var(--red)}
    .toast.success{border-left-color:var(--green)}
  </style>
</head>
<body>

  <div class="topbar">
    <div class="brand">⚡ Infinity Bot Dashboard</div>
    <div class="stats" id="topstats">
      <div class="stat"><span class="lbl">Leads totales</span><span class="val" id="stat-total">—</span></div>
      <div class="stat"><span class="lbl">Activos</span><span class="val" id="stat-active">—</span></div>
      <div class="stat"><span class="lbl">Agendados</span><span class="val" id="stat-scheduled">—</span></div>
      <div class="stat"><span class="lbl">🚨 Escalaciones</span><span class="val" id="stat-esc">—</span></div>
    </div>
    <div class="live"><span class="dot"></span> EN VIVO <span class="ts" id="last-update">—</span><span class="sound-toggle" id="sound-toggle" title="Sonido al recibir mensaje">🔔</span></div>
  </div>

  <div class="app">
    <!-- LISTA DE CONVERSACIONES -->
    <aside class="list-panel">
      <div class="list-search">
        <input type="search" id="search" placeholder="Buscar por nombre o teléfono…" />
      </div>
      <div id="leads-list" class="loading">Cargando…</div>
    </aside>

    <!-- PANEL CONVERSACIÓN -->
    <main class="convo-panel">
      <div id="convo-content" class="empty-state">
        <div class="icon">💬</div>
        <div class="msg">Selecciona una conversación</div>
        <div class="hint">Aquí verás cada mensaje del lead, las respuestas del bot, las notas internas y podrás tomar control para responder manualmente.</div>
      </div>
    </main>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const TOKEN = new URLSearchParams(location.search).get('t');
    if (!TOKEN) {
      document.body.innerHTML = '<div style="padding:60px;text-align:center;font-family:sans-serif;color:#fff;background:#0B0F14;height:100vh">⚠️ Token requerido en URL (?t=...)</div>';
    }

    const API = '/api/wa-dashboard';
    let activeLeadId = null;
    let leads = [];

    function toast(text, type = 'success') {
      const t = document.getElementById('toast');
      t.textContent = text;
      t.className = 'toast ' + type;
      requestAnimationFrame(() => t.classList.add('show'));
      setTimeout(() => t.classList.remove('show'), 3000);
    }

    function timeAgo(iso) {
      if (!iso) return '';
      const diff = Date.now() - new Date(iso).getTime();
      const m = Math.floor(diff / 60000);
      if (m < 1) return 'ahora';
      if (m < 60) return m + 'min';
      const h = Math.floor(m / 60);
      if (h < 24) return h + 'h';
      const d = Math.floor(h / 24);
      return d + 'd';
    }

    async function api(path, opts = {}) {
      const url = `${API}${path}${path.includes('?') ? '&' : '?'}t=${TOKEN}`;
      const r = await fetch(url, opts);
      return r.json();
    }

    // ── Live state tracking ──
    let prevStats = {};
    let prevLeadSnapshot = {}; // id → {last_message_at, message_count}
    let soundOn = JSON.parse(localStorage.getItem('dashSoundOn') ?? 'true');
    let firstLoad = true;

    function setLastUpdate() {
      document.getElementById('last-update').textContent = 'actualizado ahora';
      const t = Date.now();
      setTimeout(() => {
        const secs = Math.round((Date.now() - t) / 1000);
        const el = document.getElementById('last-update');
        if (el && secs > 0) el.textContent = `hace ${secs}s`;
      }, 1000);
    }

    function flashStat(id) {
      const el = document.getElementById(id);
      if (!el) return;
      el.classList.remove('changed');
      void el.offsetWidth;
      el.classList.add('changed');
    }

    function playPing() {
      if (!soundOn) return;
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.connect(g); g.connect(ctx.destination);
        o.type = 'sine';
        o.frequency.setValueAtTime(880, ctx.currentTime);
        o.frequency.exponentialRampToValueAtTime(1320, ctx.currentTime + 0.08);
        g.gain.setValueAtTime(0.25, ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.35);
        o.start(); o.stop(ctx.currentTime + 0.35);
      } catch (e) {}
    }

    async function loadStats() {
      try {
        const s = await api('?action=stats');
        const map = [
          ['stat-total', s.totalLeads],
          ['stat-active', s.activeLeads],
          ['stat-scheduled', s.scheduledLeads],
          ['stat-esc', s.pendingEsc ?? 0],
        ];
        for (const [id, val] of map) {
          const el = document.getElementById(id);
          if (!el) continue;
          const old = el.textContent;
          const next = (val ?? '—') + '';
          if (old !== next) {
            el.textContent = next;
            if (!firstLoad) flashStat(id);
          }
        }
        prevStats = s;
      } catch (e) { console.error(e); }
    }

    async function loadLeads() {
      try {
        const r = await api('?action=list');
        const fresh = r.leads || [];
        // Detect new messages on existing leads
        let newMsgCount = 0;
        let newLeadCount = 0;
        const newSnapshot = {};
        for (const l of fresh) {
          newSnapshot[l.id] = {
            last_message_at: l.last_message_at,
            message_count: l.message_count || 0,
          };
          const prev = prevLeadSnapshot[l.id];
          if (!prev) {
            if (!firstLoad) newLeadCount++;
            l.__isNew = true;
          } else if (prev.last_message_at !== l.last_message_at && l.last_message_direction === 'inbound') {
            newMsgCount++;
            l.__isNew = true;
          }
        }
        leads = fresh;
        renderLeadsList(leads);
        if (!firstLoad && (newMsgCount > 0 || newLeadCount > 0)) {
          playPing();
          if (newLeadCount > 0) toast(`🎉 ${newLeadCount} lead${newLeadCount > 1 ? 's' : ''} nuevo${newLeadCount > 1 ? 's' : ''}`, 'success');
          else if (newMsgCount > 0) toast(`💬 ${newMsgCount} mensaje${newMsgCount > 1 ? 's' : ''} nuevo${newMsgCount > 1 ? 's' : ''}`, 'success');
          // Update favicon dot
          updateFaviconBadge(newMsgCount + newLeadCount);
        }
        prevLeadSnapshot = newSnapshot;
        firstLoad = false;
        setLastUpdate();
      } catch (e) {
        document.getElementById('leads-list').innerHTML = '<div class="loading">Error cargando</div>';
      }
    }

    // Favicon badge para notificaciones cuando la tab no está visible
    let unreadCount = 0;
    function updateFaviconBadge(n) {
      if (document.hasFocus()) { unreadCount = 0; document.title = 'Infinity Legacy — Bot Dashboard'; return; }
      unreadCount += n;
      document.title = `(${unreadCount}) Infinity Legacy — Bot Dashboard`;
    }
    window.addEventListener('focus', () => { unreadCount = 0; document.title = 'Infinity Legacy — Bot Dashboard'; });

    function renderLeadsList(items) {
      const list = document.getElementById('leads-list');
      if (!items.length) {
        list.innerHTML = '<div class="empty-state" style="padding:30px"><div class="msg" style="font-size:.86rem">Aún no hay leads</div><div class="hint" style="font-size:.74rem">Cuando alguien escriba al bot, aparecerá aquí en vivo.</div></div>';
        return;
      }
      list.classList.remove('loading');
      list.innerHTML = items.map(l => `
        <div class="lead-item ${l.id === activeLeadId ? 'active' : ''} ${l.__isNew ? 'new' : ''}" data-id="${l.id}">
          <div class="lead-head">
            <span class="lead-name">${l.name || l.wa_phone || 'Sin nombre'}</span>
            <span class="lead-time">${timeAgo(l.last_message_at)}</span>
          </div>
          <div class="lead-preview">${(l.last_message_body || '').substring(0, 60)}</div>
          <div class="lead-meta">
            <span class="badge stage">${l.stage || 'INITIAL'}</span>
            ${l.matched_plan ? `<span class="badge plan">${l.matched_plan}</span>` : ''}
            ${l.priority === 'urgent' ? '<span class="badge urgent">🚨 URGENT</span>' : ''}
            ${l.bot_paused ? '<span class="badge paused">⏸ Manual</span>' : ''}
            ${l.pending_escalations > 0 ? '<span class="badge urgent">🔴 Escalación</span>' : ''}
          </div>
        </div>
      `).join('');
      list.querySelectorAll('.lead-item').forEach(el => {
        el.addEventListener('click', () => openConversation(el.dataset.id));
      });
    }

    async function openConversation(leadId, opts = {}) {
      activeLeadId = leadId;
      document.querySelectorAll('.lead-item').forEach(el => el.classList.toggle('active', el.dataset.id === leadId));
      // Preserve textarea content + scroll position si es auto-refresh
      const ta = document.getElementById('reply-text');
      const preservedInput = opts.preserveInput && ta ? ta.value : null;
      const body = document.getElementById('convo-body');
      const wasNearBottom = body ? (body.scrollHeight - body.scrollTop - body.clientHeight < 80) : true;
      const r = await api(`?action=conversation&lead_id=${leadId}`);
      renderConversation(r, { preservedInput, wasNearBottom });
    }

    function renderConversation({ lead, messages, notes, escalations }, opts = {}) {
      if (!lead) return;
      const senderLabel = { lead: 'Cliente', bot: '🤖 Bot', ivan: '👤 Iván', system: 'Sistema' };
      const messagesHtml = (messages || []).map(m => `
        <div class="msg ${m.direction === 'inbound' ? 'in' : 'out'} ${m.sender_type === 'ivan' ? 'from-ivan' : ''}">
          <div class="bubble">${escapeHtml(m.body)}</div>
          <div class="meta">${senderLabel[m.sender_type] || m.sender_type} · ${timeAgo(m.created_at)}${m.llm_cost_usd ? ' · $' + parseFloat(m.llm_cost_usd).toFixed(4) : ''}</div>
        </div>
      `).join('');

      document.getElementById('convo-content').innerHTML = `
        <div class="convo-head">
          <div class="info">
            <span class="nm">${lead.full_name || lead.wa_name || 'Sin nombre'}${lead.matched_plan ? ' · <span style="color:var(--gold)">' + lead.matched_plan + '</span>' : ''}</span>
            <span class="ph">📱 +${lead.wa_phone} · Stage: ${lead.stage}${lead.ad_id ? ' · Origen: ' + lead.ad_id : ''}</span>
          </div>
          <div class="actions">
            ${lead.bot_paused
              ? `<button class="primary" onclick="releaseBot()">▶ Reactivar bot</button>`
              : `<button onclick="takeoverBot()">⏸ Tomar control</button>`}
            <button onclick="addNote()">📝 Nota</button>
            <button onclick="closeLead('WON')" style="color:var(--green)">✓ WON</button>
            <button class="danger" onclick="closeLead('LOST')">✗ LOST</button>
          </div>
        </div>
        <div class="convo-body" id="convo-body">${messagesHtml || '<div class="empty-state"><div class="msg">Sin mensajes aún</div></div>'}</div>
        <div class="convo-input">
          <textarea id="reply-text" placeholder="${lead.bot_paused ? 'Escribe tu respuesta…' : 'Pausa el bot primero para responder manual'}" ${!lead.bot_paused ? 'disabled' : ''}></textarea>
          <button id="send-btn" onclick="sendReply()" ${!lead.bot_paused ? 'disabled' : ''}>Enviar</button>
        </div>
      `;
      // Restore textarea content si veníamos de auto-refresh
      if (opts.preservedInput != null) {
        const ta = document.getElementById('reply-text');
        if (ta && !ta.disabled) ta.value = opts.preservedInput;
      }
      // Scroll bottom solo si estábamos cerca del bottom (no interrumpir si leen histórico)
      const body = document.getElementById('convo-body');
      if (body && (opts.wasNearBottom !== false)) body.scrollTop = body.scrollHeight;
    }

    function escapeHtml(s) {
      return (s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    async function takeoverBot() {
      if (!activeLeadId) return;
      const r = await api(`?action=takeover&lead_id=${activeLeadId}`, { method: 'POST' });
      if (r.ok) {
        toast('Bot pausado — ahora respondes tú', 'success');
        openConversation(activeLeadId);
      }
    }

    async function releaseBot() {
      if (!activeLeadId) return;
      const r = await api(`?action=release&lead_id=${activeLeadId}`, { method: 'POST' });
      if (r.ok) {
        toast('Bot reactivado', 'success');
        openConversation(activeLeadId);
      }
    }

    async function sendReply() {
      const text = document.getElementById('reply-text').value.trim();
      if (!text || !activeLeadId) return;
      document.getElementById('send-btn').disabled = true;
      const r = await api(`?action=send&lead_id=${activeLeadId}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text }),
      });
      if (r.ok) {
        document.getElementById('reply-text').value = '';
        openConversation(activeLeadId);
        toast('Mensaje enviado', 'success');
      } else {
        toast('Error al enviar', 'error');
        document.getElementById('send-btn').disabled = false;
      }
    }

    async function addNote() {
      if (!activeLeadId) return;
      const text = prompt('Nota interna sobre este lead:');
      if (!text) return;
      const r = await api(`?action=note&lead_id=${activeLeadId}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text }),
      });
      if (r.ok) toast('Nota guardada', 'success');
    }

    async function closeLead(outcome) {
      if (!activeLeadId) return;
      if (!confirm(`¿Marcar este lead como ${outcome}?`)) return;
      const r = await api(`?action=close&lead_id=${activeLeadId}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ outcome }),
      });
      if (r.ok) {
        toast(`Lead marcado como ${outcome}`, 'success');
        loadLeads();
        openConversation(activeLeadId);
      }
    }

    // Search filter
    document.getElementById('search').addEventListener('input', (e) => {
      const q = e.target.value.toLowerCase();
      const filtered = leads.filter(l =>
        (l.name || '').toLowerCase().includes(q) ||
        (l.wa_phone || '').includes(q)
      );
      renderLeadsList(filtered);
    });

    // ── Sound toggle ──
    const soundBtn = document.getElementById('sound-toggle');
    soundBtn.textContent = soundOn ? '🔔' : '🔕';
    soundBtn.addEventListener('click', () => {
      soundOn = !soundOn;
      localStorage.setItem('dashSoundOn', JSON.stringify(soundOn));
      soundBtn.textContent = soundOn ? '🔔' : '🔕';
      if (soundOn) playPing();
    });

    // ── Live ticker para "hace Xs" ──
    let lastFetchAt = Date.now();
    function tickRelative() {
      const secs = Math.round((Date.now() - lastFetchAt) / 1000);
      const el = document.getElementById('last-update');
      if (el) {
        if (secs < 2) el.textContent = 'ahora';
        else if (secs < 60) el.textContent = `hace ${secs}s`;
        else el.textContent = `hace ${Math.floor(secs/60)}m`;
      }
    }
    setInterval(tickRelative, 1000);

    // ── Initial load + refresh cada 3s (en vivo de verdad) ──
    let lastConvoSig = ''; // signature de la conversación abierta para detectar cambios
    async function refreshAll() {
      lastFetchAt = Date.now();
      const before = prevLeadSnapshot[activeLeadId];
      await Promise.all([loadStats(), loadLeads()]);
      // Solo refrescar conversación si hubo cambio detectado en el lead activo
      if (activeLeadId) {
        const after = prevLeadSnapshot[activeLeadId];
        const sig = after ? `${after.last_message_at}|${after.message_count}` : '';
        if (sig !== lastConvoSig) {
          lastConvoSig = sig;
          await openConversation(activeLeadId, { preserveInput: true });
        }
      }
    }
    refreshAll();
    setInterval(refreshAll, 3000);

    // Pausar polling cuando la tab está hidden (ahorra Vercel invocations)
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') refreshAll();
    });
  </script>
</body>
</html>
